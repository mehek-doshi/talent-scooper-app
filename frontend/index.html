        <span class="sidebar__brand-name">Talents Scooper</span>
        <span class="sidebar__brand-sub">@NEULEAP.AI</span>
      </div>
    </div>

    <nav class="sidebar__nav" id="sidebarNav">
      <button class="nav-item" data-view="dashboard">
        <span class="nav-item__icon material-symbols-outlined">dashboard</span> Dashboard
      </button>
      <button class="nav-item" data-view="question-banks">
        <span class="nav-item__icon material-symbols-outlined">quiz</span> Question Banks
      </button>
      <button class="nav-item" data-view="interview-schedule">
        <span class="nav-item__icon material-symbols-outlined">mic</span> Interview Schedule
      </button>
      <button class="nav-item" data-view="token-usage">
        <span class="nav-item__icon material-symbols-outlined">join_full</span> Token Usage
      </button>
    </nav>

    <div class="sidebar__footer">
      <button class="sidebar__signout" id="signOutBtn">
        <span class="material-symbols-outlined">logout</span>
        <span class="sidebar__signout__text">
          Sign out
          <small>mehek.doshi@neuleap.ai</small>
        </span>
      </button>
      <div class="sidebar__version">Version v1.6.4</div>
    </div>
  </aside>

  <!-- ============ Main column ============ -->
  <div class="main">

    <div class="topbar">
      <h1 class="topbar__title" id="pageTitle">Dashboard</h1>

      <button class="icon-btn" id="refreshBtn" aria-label="Refresh"><span class="material-symbols-outlined">refresh</span></button>

      <div class="topbar__search">
        <span class="material-symbols-outlined" aria-hidden="true">search</span>
        <input type="text" id="searchInput" placeholder="Search" />
      </div>

      <div class="topbar__right">
        <div class="date-chip-wrap">
          <button class="date-chip" id="dateChipBtn">
            <span class="material-symbols-outlined" aria-hidden="true">calendar_today</span>
            <span id="dateChipLabel">January 2026</span>
            <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
          </button>
          <div class="date-picker" id="datePicker" hidden>
            <div class="date-picker__col" id="yearCol"></div>
            <div class="date-picker__col" id="monthCol"></div>
          </div>
        </div>

        <div class="queue-badge" id="queueBadge">PROD</div>

        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"><span class="material-symbols-outlined" id="themeIcon">light_mode</span></button>

        <div class="notif-wrap">
          <button class="icon-btn" id="notifBtn" aria-label="Notifications" style="position:relative;">
            <span class="material-symbols-outlined">notifications</span>
            <span class="notif-badge" id="notifCount">2</span>
          </button>
          <div class="notif-panel" id="notifPanel" hidden>
            <div class="notif-panel__title">Notifications</div>
            <div class="notif-item">
              <strong>New candidate added</strong>
              Farhan Ali applied for Gen AI role
            </div>
            <div class="notif-item">
              <strong>Interview reassignment needed</strong>
              Ananya Iyer's interviewer marked busy
            </div>
          </div>
        </div>

        <div class="avatar" title="Mehek Doshi">MD</div>
      </div>
    </div>

    <div class="content" id="content">
      <!-- views are rendered here by app.js -->
    </div>
  </div>
</div>

<!-- ============ Assign Interviewer overlay ============ -->
<div class="overlay-backdrop" id="assignOverlay" hidden>
  <div class="assign-panel" role="dialog" aria-modal="true" aria-labelledby="assignTitle">
    <div class="assign-panel__header">
      <div>
        <h2 class="assign-panel__title" id="assignTitle">Assign Interviewer</h2>
        <p class="assign-panel__subtitle" id="assignSubtitle">Candidate &middot; Role &middot; Stage</p>
      </div>
      <button class="btn-primary" type="button">+ Add Interviewer</button>
    </div>

    <div class="assign-panel__list" id="assignList"></div>

    <button class="btn-confirm" id="confirmBtn" type="button" disabled>Confirm Assignment</button>
    <button class="overlay-close" id="closeAssignOverlay" type="button">Close</button>
  </div>
</div>

<!-- ============ Round History overlay ============ -->
<div class="overlay-backdrop" id="historyOverlay" hidden>
  <div class="history-panel" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <h2 class="history-panel__title" id="historyTitle"><span class="material-symbols-outlined">history</span> Round History</h2>
    <div id="historyList"></div>
    <button class="overlay-close" id="closeHistoryOverlay" type="button">Close</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
